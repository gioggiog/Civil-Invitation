<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You’re invited to our civil wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2f1; --card:#fbfcfb; --ink:#22302c; --muted:#5d6e68; --accent:#b8606b; --accent-ink:#fff; --line:#cfdad6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141b19; --card:#1c2623; --ink:#e8efec; --muted:#9db0a9; --accent:#d9808b; --accent-ink:#1a1214; --line:#33423d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141b19; --card:#1c2623; --ink:#e8efec; --muted:#9db0a9; --accent:#d9808b; --accent-ink:#1a1214; --line:#33423d; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Jost",system-ui,sans-serif;display:grid;place-items:center;padding:20px;overflow:hidden}
.card{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:48px 32px 40px;text-align:center;position:relative}
.card::before{content:"";position:absolute;inset:8px;border:1px solid var(--line);border-radius:3px;pointer-events:none}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(34px,9vw,46px);line-height:1.1;margin:0 0 18px}
p{margin:0 auto 10px;color:var(--muted);line-height:1.6;max-width:32ch}
.q{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:26px;color:var(--ink);margin:26px auto 28px}
.details{margin:22px 0 0;font-size:15px;color:var(--ink);line-height:1.7}
.row{display:flex;gap:14px;justify-content:center;align-items:center;min-height:52px}
button{font:500 16px/1 "Jost",system-ui,sans-serif;border-radius:999px;padding:15px 34px;cursor:pointer;border:1px solid var(--accent)}
#yes{background:var(--accent);color:var(--accent-ink)}
#yes:hover{filter:brightness(1.06)}
#no{background:transparent;color:var(--accent);transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1)}
#no.free{position:fixed}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#done{display:none}
.small{font-size:14px;margin-top:22px;max-width:none}
.small a{color:var(--accent);text-underline-offset:3px}
.btnlink{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;border-radius:999px;padding:14px 30px;font-weight:500;margin:4px 0 6px}
.btnlink:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.heart{font-size:40px;color:var(--accent);margin-bottom:8px}
@media (prefers-reduced-motion:reduce){#no{transition:none}}
</style>
</head>
<body>
<main class="card">
  <section id="ask">
    <p>With joy in our hearts, we invite you to</p>
    <h1>Our civil wedding</h1>
    <div class="details" id="details"></div>
    <div class="q">Will you be there?</div>
    <div class="row">
      <button id="yes" type="button">Yes</button>
      <button id="no" type="button">No</button>
    </div>
    <p class="small">Can’t make it? <a id="cant" href="#">Tell Gio why</a> 😅</p>
  </section>
  <section id="done">
    <div class="heart">♥</div>
    <h1>See you there!</h1>
    <p>Thank you for sharing this day with us. We can’t wait to celebrate with you.</p>
    <div class="details" id="details2"></div>
    <p class="small">Let Gio know you’re coming:</p>
    <a id="going" class="btnlink" href="#">Send a text to Gio</a>
    <p class="small">RSVP: Gio, <span id="ph"></span></p>
  </section>
</main>
<script>
// Edit these details
var INFO = {
  names: "Gio & Dane",
  date: "Monday, February 8, 2027",
  time: "",   // e.g. "10:00 AM"
  place: "",  // e.g. "City Hall, Cebu"
  phone: "09773039294"
};
var PHONE_PRETTY = "0977 303 9294";

var d = INFO.names + "<br>" + INFO.date + (INFO.time ? " at " + INFO.time : "") + (INFO.place ? "<br>" + INFO.place : "");
function smsLink(text){ return "sms:" + INFO.phone + "?&body=" + encodeURIComponent(text); }
document.getElementById("cant").href = smsLink("Hi Gio! I can’t make it to your civil wedding on Feb 8 because... ");
document.getElementById("going").href = smsLink("Hi Gio and Dane! Yes, I’ll be there at your civil wedding on Feb 8! 💍");
document.getElementById("details").innerHTML = d;
document.getElementById("details2").innerHTML = d;

document.getElementById("ph").textContent = PHONE_PRETTY;
var yes = document.getElementById("yes");
var no = document.getElementById("no");

function dodge(e){
  if (e && e.cancelable) e.preventDefault();
  var m = 12, w = no.offsetWidth, h = no.offsetHeight;
  var vw = window.innerWidth, vh = window.innerHeight;
  var yr = yes.getBoundingClientRect();
  var cur = no.getBoundingClientRect();
  var x, y, tries = 0, ok;
  do {
    x = m + Math.random() * (vw - w - 2 * m);
    y = m + Math.random() * (vh - h - 2 * m);
    var farYes = x > yr.right + 24 || x + w < yr.left - 24 || y > yr.bottom + 24 || y + h < yr.top - 24;
    var farCur = Math.hypot(x - cur.left, y - cur.top) > 120;
    ok = farYes && farCur;
    tries++;
  } while (!ok && tries < 40);
  if (!no.classList.contains("free")) {
    no.style.left = cur.left + "px";
    no.style.top = cur.top + "px";
    no.classList.add("free");
    no.getBoundingClientRect();
  }
  no.style.left = x + "px";
  no.style.top = y + "px";
}

["pointerenter","pointerdown","touchstart","mousedown","click","focus"].forEach(function(ev){
  no.addEventListener(ev, dodge, {passive:false});
});

window.addEventListener("resize", function(){
  if (no.classList.contains("free")) dodge();
});

yes.addEventListener("click", function(){
  document.getElementById("ask").style.display = "none";
  no.style.display = "none";
  document.getElementById("done").style.display = "block";
});
</script>
</body>
</html>
